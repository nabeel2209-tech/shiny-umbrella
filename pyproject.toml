[project]
name = "trading"
version = "0.1.0"
description = "Multi-agent algo trading platform (India, Dhan first)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "pyarrow>=16",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "websockets>=12",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "structlog>=24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trading*"]
# Without this, setuptools treats directories lacking __init__.py (templates,
# example YAML) as PEP 420 namespaces and the editable install then imports
# `trading` itself as a namespace in script mode - trading/__init__.py never runs.
namespaces = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error::RuntimeWarning",
    # third-party test client noise (starlette's TestClient), not our code
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
markers = [
    "integration: needs live network / credentials (skipped in CI)",
    "redis: needs a reachable Redis",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and bodies as default values; that is the idiom
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body", "fastapi.Query", "fastapi.Form", "fastapi.File"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
